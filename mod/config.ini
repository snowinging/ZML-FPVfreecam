[menu]
title=自由镜头

[field.enabled]
type=bool
label=启用自由镜头
description=模组总开关。关闭后模组不再控制相机。
default=true

[field.fov]
type=number
label=视野角度
description=相机垂直视野，单位：度。
default=90
min=40
max=120
step=1

[field.sensitivity]
type=number
label=视角灵敏度
description=鼠标转动视角的灵敏度倍率。
default=2
min=0.2
max=8
step=0.1

[field.speed]
type=number
label=平移速度
description=基础平移速度，单位：米/秒。
default=8
min=0.5
max=60
step=0.5

[field.boost]
type=number
label=加速倍率
description=按住 Shift 时的速度倍率。
default=4
min=1
max=10
step=0.5

[field.smoothing]
type=number
label=移动平滑
description=速度的平滑时间常数，单位：秒。数值越大过渡越平缓，0 为立即跟随。
default=0.12
min=0
max=0.4
step=0.01

[field.pitch_limit]
type=number
label=俯仰上限
description=视角上下翻转的角度上限，单位：度。
default=89
min=40
max=90
step=1

[field.invert_y]
type=bool
label=反转纵向视角
description=启用后，鼠标上推为向下俯视。
default=false

[field.fpv]
type=bool
label=遥控器接管
description=连接遥控器并解锁后，相机改由遥控器控制。飞行控制与物理采用 FPV 模型（角度/半自稳/手动三种模式，油门表示推力，手动模式可翻滚与倒飞）。松开摇杆、触发急停或链路中断时立即交回键鼠控制。游戏内可用 Insert 临时关闭接收，End 输出链路状态。
default=true

[field.fpv_mode]
type=number
label=飞行模式（0=角度 1=半自稳 2=手动）
description=0 角度模式：杆量对应目标倾角，松开摇杆自动回平，适合入门。1 半自稳模式：双摇杆回中并保持 0.3 秒后回平，其余时间按角速度控制。2 手动模式（Acro）：杆量对应角速度，姿态不设限，可完成翻滚与倒飞，需手动修正姿态。遥控器上的 mode 开关拨到高位时固定使用手动模式。
default=0
min=0
max=2
step=1

[field.fpv_cam_tilt]
type=number
label=镜头角度（度）
description=相机相对机身固定上仰的角度，单位：度。真实穿越机的相机带一定上仰安装角，平飞时前方目标落在画面中央；填 0 表示相机与机身平行。该参数只影响画面，不影响飞行控制。
default=15
min=0
max=45
step=1

[field.fpv_tilt_max]
type=number
label=角度模式最大倾角
description=角度模式下满杆时保持的倾角，单位：度。60 度已属较大倾角。
default=60
min=10
max=89
step=1

[field.fpv_angle_kp]
type=number
label=角度模式跟随增益
description=角度模式的比例增益，单位：1/秒。数值偏小则响应迟缓，偏大则易产生振荡，6 约为一秒内到位。
default=6
min=1
max=30
step=0.5

[field.fpv_horizon_delay]
type=number
label=半自稳回平延迟（秒）
description=半自稳模式下，双摇杆回中并保持该时长后开始自动回平，可避免穿越狭窄空间时自稳介入造成的姿态突变。
default=0.3
min=0
max=2
step=0.05

[field.fpv_rate_roll]
type=number
label=手动模式满杆横滚角速度（度/秒）
description=手动模式下满杆时每秒转过的角度。辅助程序只发送杆量，该参数仅在模组侧生效。
default=400
min=50
max=2000
step=10

[field.fpv_rate_pitch]
type=number
label=手动模式满杆俯仰角速度（度/秒）
description=同上。
default=400
min=50
max=2000
step=10

[field.fpv_rate_yaw]
type=number
label=手动模式满杆偏航角速度（度/秒）
description=同上。
default=500
min=50
max=2000
step=10

[field.fpv_expo]
type=number
label=手动模式杆量曲线
description=手动模式的杆量曲线，公式 a*x^3+(1-a)*x。0 为线性；0.35 左右为中段平缓、两端灵敏。
default=0.35
min=0
max=0.9
step=0.05

[field.fpv_deadzone]
type=number
label=摇杆死区
description=小于该比例的杆量按 0 处理。
default=0.02
min=0
max=0.3
step=0.01

[field.fpv_limit]
type=number
label=半自稳角速度段倾角上限
description=半自稳模式下按角速度控制时的俯仰与横滚上限，单位：度。手动模式不设限，该参数对其无效。
default=60
min=20
max=89
step=1

[field.fpv_thrust]
type=number
label=满油门加速度（米/秒²）
description=推力加速度。悬停油门 = 重力加速度 / 该值，默认 24 时约 41%，因此油门到底时为零推力、自由落体（与真实穿越机一致）。数值偏小则推力偏弱、手感柔和，偏大则响应更强烈。
default=24
min=5
max=120
step=1

[field.fpv_gravity]
type=number
label=重力加速度（米/秒²）
description=与推力共同决定悬停油门，并影响松油门后的下落速度。
default=9.81
min=0
max=30
step=0.01

[field.fpv_drag_linear]
type=number
label=线性阻力
description=与速度成正比的阻力系数，单位：1/秒。默认 0.02 接近空气阻力水平，数值增大后飞行显得迟缓。
default=0.02
min=0
max=1
step=0.01

[field.fpv_drag_quad]
type=number
label=二次阻力
description=与速度平方成正比的阻力系数，用于限制最高速度。
default=0.02
min=0
max=1
step=0.01
