[menu]
title=自由镜头

[field.enabled]
type=bool
label=启用自由镜头
description=总开关。关掉后模组完全不接管相机。
default=true

[field.fov]
type=number
label=视野大小
description=自由镜头期间的垂直视野角度（度）。
default=90
min=40
max=120
step=1

[field.sensitivity]
type=number
label=视角灵敏度
description=鼠标转视角的灵敏度倍率。
default=2
min=0.2
max=8
step=0.1

[field.speed]
type=number
label=飞行速度
description=基础平移速度（米/秒）。
default=8
min=0.5
max=60
step=0.5

[field.boost]
type=number
label=加速倍率
description=按住 Shift 时的速度倍率。
default=4
min=1
max=10
step=0.5

[field.smoothing]
type=number
label=移动平滑
description=速度的平滑时间常数（秒），越大越飘。0 为硬跟。
default=0.12
min=0
max=0.4
step=0.01

[field.pitch_limit]
type=number
label=俯仰上限
description=视角上下翻转的角度上限（度）。
default=89
min=40
max=90
step=1

[field.invert_y]
type=bool
label=反转纵向视角
description=鼠标上推改为俯视。
default=false

[field.fpv]
type=bool
label=遥控接管
description=连接遥控器并解锁后，相机改由遥控器的角速率驾驶（和真穿越机一样是速率模式）；收杆、急停或断链立刻交回键鼠。游戏内可用 Ctrl+F7 临时关掉接收、Ctrl+F9 查链路状态。
default=true

[field.fpv_scale]
type=number
label=遥控角速率倍率
description=觉得太灵或太钝就调这里。1 等于辅助程序里设定的角速率上限。
default=1
min=0.2
max=4
step=0.05

[field.fpv_limit]
type=number
label=遥控俯仰横滚上限
description=积分出来的相机角度上限（度）。60 度在穿越里已经算很陡了。
default=60
min=20
max=89
step=1

[field.fpv_selflevel]
type=bool
label=自稳（松杆回平）
description=遥控器 mode 开关在关位时，松杆后俯仰横滚自动回水平；把 mode 拨上去就是纯速率。关掉这项则一律纯速率。
default=true

[field.fpv_level_speed]
type=number
label=自稳回平速度
description=松杆后相机回水平的速度（度/秒）。慢了拖沓，快了像被弹回来。
default=90
min=10
max=400
step=10
