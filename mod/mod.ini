[mod]
id=fpvfreecam
name=FPV/自由镜头
version=0.1.29
description=脱开角色的自由飞行观察相机：键鼠控制平移与视角，视野与速度可调，开关可绑定按键；配套辅助程序 Endfield-FpvHelper 把遥控器或手柄的通道值映射后经 UDP 送入游戏，连接并解锁后由遥控器接管相机，飞行控制与物理采用 FPV 模型（角度/半自稳/手动三种模式，油门表示推力，手动模式可翻滚与倒飞，三轴均按机体轴计算），镜头角度可调，遥控器开关可一键回平与姿态复位；模式开关支持两档开关与三档拨杆（三档由辅助程序逐档标定）。
authors=snowinging
tags=视角,摄影
icon=icon.png
config=config.ini
config_menu=standard
library=FreeCam.dll
enabled=true
api=1
depends=keybinds
